<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Hearth: private chat and voice for one group of friends">
  <title>Hearth: private chat and voice for one group of friends</title>
  <style>
    .word { font: 700 104px 'Inter', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; letter-spacing: -3px; fill: #e6e7ea; }
    .tag { font: 500 27px 'Inter', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #a4a7ae; }
    .pill { font: 600 17px 'Inter', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #fbbf24; letter-spacing: 0.4px; }
    .ember { fill: #f59e0b; transform-box: fill-box; animation: rise 7s ease-in infinite; opacity: 0; }
    .ring { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
    .bar { transform-box: fill-box; transform-origin: center; animation: talk 1.1s ease-in-out infinite alternate; }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 0.9; } 100% { transform: translateY(-110px); opacity: 0; } }
    @keyframes pulse { 0% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(1.35); opacity: 0; } }
    @keyframes talk { from { transform: scaleY(0.35); } to { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) {
      .ember, .ring, .bar { animation: none; }
      .ember { opacity: 0.5; }
    }
  </style>
  <defs>
    <radialGradient id="glow" cx="0.15" cy="0.75" r="0.55">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.86" cy="0.5" r="0.3">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="rgba(255,255,255,0.05)"/>
    </pattern>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="0.55" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fffbeb"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="320" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="#111214"/>
    <rect width="1280" height="320" fill="url(#dots)"/>
    <rect width="1280" height="320" fill="url(#glow)"/>
    <rect width="1280" height="320" fill="url(#glow2)"/>

    <!-- Logo (same artwork as docs/assets/logo.svg), 176 px. -->
    <g transform="translate(96 72) scale(1.375)">
      <rect width="128" height="128" rx="30" fill="#1e1f22" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
      <path d="M30 104V62a34 34 0 0 1 68 0v42" fill="none" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round"/>
      <path d="M20 106h88" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
      <path d="M64 34c5 13 22 23 22 44 0 13-10 22-22 22s-22-9-22-22c0-11 7-17 10-26 3 7 6 10 9 11-2-9-1-19 3-29z" fill="url(#flame)"/>
      <path d="M64 68c3 7 10 11 10 19 0 6-4 10-10 10s-10-4-10-10c0-5 3-8 5-12 2 3 3 4 4 4 0-4 0-8 1-11z" fill="url(#core)"/>
    </g>

    <!-- Embers rising from the flame. -->
    <circle class="ember" cx="176" cy="122" r="3" style="animation-delay: 0s"/>
    <circle class="ember" cx="196" cy="116" r="2.2" style="animation-delay: 1.6s"/>
    <circle class="ember" cx="210" cy="126" r="2.6" style="animation-delay: 3.1s"/>
    <circle class="ember" cx="186" cy="130" r="1.8" style="animation-delay: 4.4s"/>
    <circle class="ember" cx="202" cy="120" r="2" style="animation-delay: 5.7s"/>

    <!-- Wordmark and tagline. -->
    <text class="word" x="316" y="162" textLength="370" lengthAdjust="spacingAndGlyphs">Hearth</text>
    <text class="tag" x="320" y="210" textLength="600" lengthAdjust="spacing">Private chat and voice for one group of friends.</text>

    <!-- Feature pills. -->
    <g transform="translate(320 236)">
      <rect width="88" height="34" rx="17" fill="rgba(245,158,11,0.14)"/>
      <text class="pill" x="44" y="23" text-anchor="middle">chat</text>
      <rect x="100" width="92" height="34" rx="17" fill="rgba(245,158,11,0.14)"/>
      <text class="pill" x="146" y="23" text-anchor="middle">voice</text>
      <rect x="204" width="94" height="34" rx="17" fill="rgba(245,158,11,0.14)"/>
      <text class="pill" x="251" y="23" text-anchor="middle">video</text>
      <rect x="310" width="156" height="34" rx="17" fill="rgba(245,158,11,0.14)"/>
      <text class="pill" x="388" y="23" text-anchor="middle">screen share</text>
      <rect x="478" width="134" height="34" rx="17" fill="rgba(245,158,11,0.14)"/>
      <text class="pill" x="545" y="23" text-anchor="middle">self-hosted</text>
    </g>

    <!-- A little voice room: friends around the fire, one of them speaking. -->
    <g transform="translate(1100 160)">
      <circle r="98" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" stroke-dasharray="3 7"/>
      <!-- speaking avatar (top) -->
      <circle class="ring" cx="0" cy="-98" r="30" fill="none" stroke="#22c55e" stroke-width="3"/>
      <circle cx="0" cy="-98" r="27" fill="#3b3f46" stroke="#22c55e" stroke-width="3"/>
      <circle cx="0" cy="-104" r="8" fill="rgba(255,255,255,0.75)"/>
      <path d="M-14 -82a14 12 0 0 1 28 0z" fill="rgba(255,255,255,0.75)"/>
      <!-- others -->
      <circle cx="93" cy="30" r="25" fill="#2f4b5a"/>
      <circle cx="93" cy="24" r="7.5" fill="rgba(255,255,255,0.75)"/>
      <path d="M80 44a13 11 0 0 1 26 0z" fill="rgba(255,255,255,0.75)"/>
      <circle cx="58" cy="79" r="23" fill="#4b3a5c"/>
      <circle cx="58" cy="73" r="7" fill="rgba(255,255,255,0.75)"/>
      <path d="M46 92a12 10 0 0 1 24 0z" fill="rgba(255,255,255,0.75)"/>
      <circle cx="-58" cy="79" r="23" fill="#5a3d33"/>
      <circle cx="-58" cy="73" r="7" fill="rgba(255,255,255,0.75)"/>
      <path d="M-70 92a12 10 0 0 1 24 0z" fill="rgba(255,255,255,0.75)"/>
      <circle cx="-93" cy="30" r="25" fill="#30503d"/>
      <circle cx="-93" cy="24" r="7.5" fill="rgba(255,255,255,0.75)"/>
      <path d="M-106 44a13 11 0 0 1 26 0z" fill="rgba(255,255,255,0.75)"/>
      <!-- muted badge on one friend -->
      <circle cx="-74" cy="46" r="10" fill="#111214"/>
      <circle cx="-74" cy="46" r="8" fill="#dc2626"/>
      <path d="M-78 42l8 8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <!-- the fire in the middle, with a voice level -->
      <g transform="translate(-26 -40) scale(0.4)">
        <path d="M64 34c5 13 22 23 22 44 0 13-10 22-22 22s-22-9-22-22c0-11 7-17 10-26 3 7 6 10 9 11-2-9-1-19 3-29z" fill="url(#flame)"/>
        <path d="M64 68c3 7 10 11 10 19 0 6-4 10-10 10s-10-4-10-10c0-5 3-8 5-12 2 3 3 4 4 4 0-4 0-8 1-11z" fill="url(#core)"/>
      </g>
      <g fill="#f59e0b">
        <rect class="bar" x="-17" y="10" width="6" height="22" rx="3" style="animation-delay: 0s"/>
        <rect class="bar" x="-7" y="4" width="6" height="34" rx="3" style="animation-delay: 0.25s"/>
        <rect class="bar" x="3" y="8" width="6" height="26" rx="3" style="animation-delay: 0.5s"/>
        <rect class="bar" x="13" y="13" width="6" height="16" rx="3" style="animation-delay: 0.75s"/>
      </g>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1278.5" height="318.5" rx="23.25" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
</svg>
